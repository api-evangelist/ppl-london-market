search_note: >-
  No official or third-party MCP server for PPL was found. Searched the PPL Next Gen
  developer portal, placingplatformlimited.com, npm (@modelcontextprotocol and PPL/London
  Market Group terms), PyPI and GitHub — PPL operates no GitHub organisation. This is a
  DERIVED candidate tool surface, one tool per OpenAPI operation, not a published server.
access_note: >-
  Any real MCP server for PPL would inherit the platform's market gating: an Azure AD
  (Microsoft Entra ID) bearer token carrying the user_impersonation scope, a per-environment
  X.509 client certificate, and the X-Auth-Team / X-Auth-Impersonated-User headers on every
  call. There is no API key and no anonymous access.
