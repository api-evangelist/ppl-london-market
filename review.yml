      HTML pages but is absent from servers[].
  acordPosture:
    phrase: ACORD GRLC data model in the API design; ACORD ADEPT Placing gateway in production
    evidence:
    - source: https://placingplatformlimited.com/api-integrations/
      status: 200
      quote: Built using REST standards and ACORD GRLC data model
    - source: https://placingplatformlimited.com/news/axa-xl-goes-live-with-ppl/
      status: 200
      date: '2025-12-02'
      quote: |
        PPL today announced the successful opening of a new data exchange gateway
        between AXA XL and the London Market's most widely used electronic placing
        platform, Placing Platform Limited (PPL), via ACORD Solutions Group's
        cutting-edge ADEPT Placing data exchange gateway. ... ADEPT Placing is an
        innovative feature within ADEPT (ACORD Data Exchange Platform & Translator)
        that empowers (re)insurers to efficiently exchange data with all major placing
        platforms through a single, easily accessible interface. This reduces the need
        for multiple complex integrations and time-intensive data mapping, while
        supporting alignment with ACORD Global Reinsurance & Large Commercial (GRLC)
        Standards for superior data quality and interoperability.
    - source: https://placingplatformlimited.com/news/api_adoption_programme/
      status: 200
      date: '2024-02-29'
      quote: |
        A further six organisations (including Miller, ACORD Solutions Group, WCL - A
        Zywave company, and Novidea, on behalf of Gallagher and Howden) are joining the
        next API phase of the EAP.
    caveat: |
      The string "ACORD" does not appear anywhere inside the five harvested OpenAPI
      documents, and it does not appear on the developer portal's own Get-Started or
      Technical Model pages. The ACORD GRLC alignment is asserted in PPL's marketing
      and press material and is real in the sense that a live ADEPT Placing gateway is
      in production with AXA XL, but it is not declared or traceable in the
      machine-readable artifacts. No AL3, no ACORD XML, no IVANS, no NGDS reference was
      found anywhere on PPL's properties - correctly so, since those are US personal
      and small-commercial agency-download standards and PPL is a London subscription-
      market open-market placing platform.
  insuranceVerbs:
    quote:
      exposed: true
      surface: Submissions API - underwriters retrieve broker submissions and manage negotiation of terms of cover (GET /submissions, GET/POST /submissions/{id}/negotiations, PUT .../negotiations/{id}, POST /submissions/{id}/send)
      audience: partner-only (London Market carriers/underwriters)
    bind:
      exposed: true
      surface: Placements API - contract negotiation, section participations and role assignment (POST /contracts, GET/POST /contracts/{id}/negotiations, POST /contracts/{id}/negotiations/{id}/send, POST /contracts/{id}/sections/{id}/participations, POST /contracts/{id}/assignRoles)
      audience: partner-only (London Market brokers)
    issue:
      exposed: true
      surface: Documents API - Market Reform Contract (MRC) and supporting document creation, versioning, content retrieval and secured download
      audience: partner-only
    fnol:
      exposed: false
      note: PPL is a placement platform. It has no claims or first-notice-of-loss surface; claims in the London Market run through separate market infrastructure (Velonetic/Blueprint Two claims services), not PPL.
    consumerFacing: false
    agentFacing: false
    partnerOnly: true
  authModel:
    scheme: OAuth2 authorization-code with Microsoft Entra ID (Azure AD) plus on-behalf-of token exchange, service-account (headless) tokens, and mandatory X.509 client certificate registration per API Gateway environment
    documentedAt: https://developer.pplnextgen.com/Get-Started/Authentication-Information
    details:
    - APIs are fronted by the LIMOSS API Gateway; only identities added to the API Gateway Azure AD tenant can call them.
    - Browser flow ends with an Azure AD access token; the app must then request a second on-behalf-of token carrying the user_impersonation scope (and correct audience) before the gateway will pass the call through.
    - Service accounts use headless server-to-server tokens with a dummy email claim.
    - Each organisation must register an X.509 certificate separately in each of the three environments (Sand, PreProd, Prod).
    - Sample configuration published in the portal is ASP.NET Core / MSAL-era (Instance https://login.microsoftonline.com/, TenantId, ClientId, ClientSecret, Resource, CallbackPath /signin-oidc).
    apiKeys: false
    mTLS: true
    wellKnownDiscovery: false
  webhooks:
    present: false
    asyncapi: false
    note: |
      No webhook catalogue, no callbacks in any of the five OpenAPI documents, and no
      AsyncAPI artifact. The Events API is strictly pull - GET /notifications, GET
      /notifications/{id}, POST /notifications/markAllAsRead, GET /transactions, GET
      /transactions/{id}. For a platform whose entire value is real-time multi-party
      negotiation, the absence of event push is the single most notable design gap.
  postman:
    present: true
    publicWorkspace: false
    note: |
      Five downloadable Postman collection zips, one per API, hosted on the developer
      portal under /static/resources/<api>/ and named "NextGen Market <X> API
      [Release 3].postman_collection.zip". Confirmed retrievable anonymously (HTTP 200,
      application/x-zip-compressed). There is no public Postman workspace on
      postman.com.
  graphql:
    present: false
  grpc:
    present: false
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.londonmarketgroup.co.uk/ppl/nextgen/
    documented: true
    note: Production API Gateway host, documented on each API's Key Details page.
  - protocol: REST
    scheme: https
    baseURL: https://sand-api.londonmarketgroup.co.uk/ppl/nextgen/
    documented: true
    note: Sandbox host, the only server declared in servers[] across all five OpenAPI documents.
  - protocol: WebSocket
    scheme: wss
    documented: false
    note: No WebSocket surface is documented anywhere on the developer portal or in the specs.
  - protocol: GraphQL
    documented: false
  liveProbes:
  - url: https://api.londonmarketgroup.co.uk/ppl/nextgen/placements/v1/health
    status: 200
    note: Production gateway health endpoint answers anonymously.
  - url: https://sand-api.londonmarketgroup.co.uk/ppl/nextgen/placements/v1/health
    status: 200
    note: Sandbox gateway health endpoint answers anonymously.
  marketContext: |
    The UK has the FCA and PRA but no open-insurance obligation; Open Finance remains
    consultation, not rule. What makes the UK distinctive is the London subscription
    market and its modernisation programme - Blueprint Two, PPL, Whitespace, Ki. PPL is
    the largest of the accredited placing platforms in that programme, and it is aimed
    squarely at brokers and syndicates rather than at developers. PPL is therefore the
    counter-example to the sector rule: the specifications are real, the data model is
    a genuine industry standard (ACORD GRLC), the auth is enterprise-grade, and yet the
    whole thing is close to invisible from the outside because there is no self-serve
    signup, no public sandbox key, and no marketing of the portal beyond a request-access
    form.
