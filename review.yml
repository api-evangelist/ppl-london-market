aid: ppl-london-market
name: PPL
review:
  question: Does PPL (Placing Platform Limited) publish a real, self-serve public API
    surface for the London insurance market, and what is its ACORD posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: market-infrastructure
identityCorrection:
  note: |
    The brief supplied pplfirst.com as the primary domain for PPL. That domain was
    fetched (HTTP 200) and is NOT the London Market PPL - it belongs to PPL First /
    Public Partnerships LLC, a United States Medicaid self-directed-care financial
    management services company. This is a homonym trap. The London Market PPL is
    Placing Platform Limited, whose corporate site is placingplatformlimited.com
    (HTTP 200) and whose platform and developer portal live on pplnextgen.com. All
    findings below relate to Placing Platform Limited only.
  wrongDomainProbed: https://pplfirst.com
  wrongDomainStatus: 200
  wrongDomainOwner: PPL First / Public Partnerships LLC (US Medicaid FMS)
  correctDomain: https://placingplatformlimited.com
  correctDomainStatus: 200
findings:
  summary: |
    PPL is the London Market's not-for-profit electronic placing platform - market
    infrastructure, not a carrier or a broker. Unusually for insurance, it publishes a
    REAL developer portal with reference documentation, a named API catalogue, and
    downloadable machine-readable specifications, all readable anonymously. Five REST
    API collections are published - Organisations, Placements, Submissions, Documents
    and Events - and each one ships a downloadable OpenAPI 3.0.1 document and a Postman
    collection zip. All five specs were fetched and parse cleanly as OpenAPI 3.0.1.

    It is NOT self-serve. Reading the docs is open; calling the APIs is market-gated.
    Onboarding runs through three gates: (1) Developer Portal onboarding by emailing
    PPLEnquiries@placingplatformlimited.com; (2) subscription to LIMOSS API Common
    Services and guesting of the account identity into the LIMOSS API Gateway
    Microsoft Entra ID (Azure AD) tenant, separately per environment (Sand, PreProd,
    Prod); and (3) registration of an X.509 certificate per API Gateway environment.
    The corporate site reinforces this - placingplatformlimited.com/api-integrations/
    is a marketing page whose only call to action is a "Request access" contact form
    for the Developer Portal, and PPL publishes no self-service signup, no free tier,
    no API keys and no public sandbox credentials.

    Classification: the developer portal is category (a), a real developer portal with
    reference docs, but the integration surface behind it is partner-gated. Both are
    true and both are recorded.
