format_note: >-
  PPL does not use RFC 9457 application/problem+json. Every 4xx/5xx response across all five
  APIs returns the same JSON envelope, components.schemas.error_document, with a single
  errors[] array. Each error carries code, message, and — for field-level validation —
  field and argument. Content type is application/json.
envelope:
  media_type: application/json
  schema: error_document
  shape:
    errors:
    - code: string        # the machine-readable error code
      message: string     # the human-readable error message
      field: string|null  # the field the error occurred on, when field specific
      argument: string|null # the syntax argument the field was validated against
