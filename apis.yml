  name: PPL Submissions API
  description: >-
    Enables underwriters to retrieve Submission requests supplied by a broker
    and to manage their negotiation of terms of cover, including reassignment of a
    negotiation and sending a response back to the broker. This is the quote-side
    surface of the platform. OpenAPI 3.0.1, 8 paths and 10 operations.
