- aid: ppl-london-market:ppl-placements-api
  name: PPL Placements API
  description: >-
    Manages the Placement structure in PPL Next Gen - Placements, Programmes,
    Contracts and the Sections within a Contract - together with carrier and underwriter
    participations, role assignment, and the broker-side negotiation of terms. This is
    the bind-side surface of the platform. OpenAPI 3.0.1, 16 paths and 32 operations.
  humanURL: https://developer.pplnextgen.com/placements
  baseURL: https://api.londonmarketgroup.co.uk/ppl/nextgen/placements/v1
