aid: ppl-london-market
url: https://raw.githubusercontent.com/api-evangelist/ppl-london-market/refs/heads/main/apis.yml
name: PPL
kind: company
description: >-
  PPL (Placing Platform Limited) is the London Market's not-for-profit
  electronic placing platform, incorporated in England and Wales in 2013 and trading
  since the first risk was bound on the platform in July 2016. Owned collectively by
  the market it serves, PPL lets brokers and carriers quote, negotiate, bind and renew
  open-market (re)insurance risks electronically across almost all classes of business
  written in London, and is used by roughly 200 carriers and 200 broking firms. It is
  market infrastructure rather than a carrier or a broker - it writes no insurance and
  carries no risk - and it is one of the accredited placing platforms underpinning
  Lloyd's Blueprint Two, generating the Core Data Record for bound business. Its API
  posture is unusual for insurance and genuinely good: the PPL Next Gen API Developer
  Portal at developer.pplnextgen.com is publicly readable and publishes a real API
  catalogue of five REST collections - Organisations, Placements, Submissions,
  Documents and Events - each with a downloadable OpenAPI 3.0 document and a Postman
  collection, built on REST standards and the ACORD GRLC (Global Reinsurance and Large
  Commercial) data model. Actually calling the APIs is market-gated rather than
  self-serve: consumers must be onboarded by PPL, subscribe to LIMOSS API Common
  Services, be guested into the Microsoft Entra ID (Azure AD) tenant of the LIMOSS API
  Gateway, and register an X.509 certificate per environment. The surface covers quote
  and bind (submission negotiation, contract negotiation, participations, firm order)
  and contract issuance via the Market Reform Contract document set; there is no claims
  or FNOL API, and no webhook or event-push surface - the Events API is pull-based.
