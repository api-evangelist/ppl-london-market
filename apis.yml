- aid: ppl-london-market:ppl-documents-api
  name: PPL Documents API
  description: >-
    Manages document files and document metadata across the Placement
    hierarchy, including the Market Reform Contract (MRC) itself and its supporting
    documents, with versioning, content retrieval, download and a separate secured
    content and download path. This is the contract-issuance surface. OpenAPI 3.0.1,
    8 paths and 11 operations.
  humanURL: https://developer.pplnextgen.com/documents
  baseURL: https://api.londonmarketgroup.co.uk/ppl/nextgen/documents/v1
