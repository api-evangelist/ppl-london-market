- aid: ppl-london-market:ppl-events-api
  name: PPL Events API
  description: >-
    Retrieves informative and actionable notifications about an interested
    party's involvement in the placement process, plus the business transaction log for
    contract-related engagements. Pull-based only - notifications and transactions are
    polled over REST; PPL publishes no webhook, callback or AsyncAPI event-push surface.
    OpenAPI 3.0.1, 7 paths and 7 operations.
  humanURL: https://developer.pplnextgen.com/events
  baseURL: https://api.londonmarketgroup.co.uk/ppl/nextgen/events/v1
  tags:
