versioning:
  scheme: uri-path major version, Major.Minor overall
  current: v1
  docs: https://developer.pplnextgen.com/Get-Started/Base-API-Standard
  policy: >-
    "Endpoints must be versioned using a Major.Minor scheme, E.g. 4.5." The major version is
    carried in the URI path; minor versions are handled transparently by the API Gateway —
    "consumers must automatically be routed by the API gateway to the latest minor version that
    exists for the major version". Minor versions must maintain backward compatibility; major
    versions may break it.
  in_spec: info.version is "1" in all five documents; every production path is /v1.
  runtime_probe:
    endpoint: /version
    auth: required
    returns: [apiVersionNumber, implementationVersion]
    present_in: all five APIs

release_status:
  portal_stage: BETA
  portal_statement: >-
    The developer portal carries a BETA classification indicating the site "remains under
    development"; the portal describes itself as "Currently in BETA release and testing by Market
    participants."
  key_details_statement: >-
    The per-API Key Details pages state "Production Releases: None", with no candidate release and
    no development snapshots listed, as observed 2026-07-25.
  artefact_release_label: >-
    The five downloadable Postman collections are labelled "[Release 3]"; the OpenAPI files are
    labelled v1.0 (Swagger_PlacementsApi_v1.0.json and siblings).
  spec_stability: >-
    "The formal API specifications are fixed and under formal version control, whilst the tools
    and supporting information will be enhanced." (RoadMap page)

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    PPL publishes no deprecation or sunset policy, and neither the Sunset nor the Deprecation
    response header (RFC 8594) is mentioned in the Base API Standard or declared in any of the
    five OpenAPI documents. The only lifecycle commitment made is the Major.Minor compatibility
    rule above.

