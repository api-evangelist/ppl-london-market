  /contracts/{contractId}/assignRoles:
    post:
      tags:
      - contract
      description: Initiates the asynchronous operation to assign the contractual roles to Participations and their Stamps on the Contract. Where a specific Slip Leader has been identified, the process will take this into consideration during the assignment process.
      operationId: Contract_AssignRoles_v1
      parameters:
      - name: X-Auth-Impersonated-User
        in: header
