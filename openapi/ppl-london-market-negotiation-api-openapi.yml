components:
  schemas:
    placement_negotiation_amount:
      type: object
      properties:
        value:
          type: number
          description: The specified underwriting value, as an amount.
          example: 0.1
        comments_history:
          type: array
          description: Array of comments on the Line Percentage Negotiation.
          items:
            $ref: '#/components/schemas/placement_negotiation_comments'
      additionalProperties: false
      description: The specified underwriting value, as an amount.
    placement_negotiation_facility_panel_signed:
      type: object
      properties:
        line_percentage:
          type: number
          description: The specified underwriting value, as a percentage.
          example: 0.1
        currency_code:
          type: string
          description: The 3-character code that represents the currency in ISO 4217 standard.
          default: ''
        amount:
          type: number
          description: The specified underwriting value, as an amount.
          example: 0.1
        date:
          type: string
          description: The date and timestamp when the signed line was provided.
          format: date-time
          example: '2014-12-31T23:59:59.938Z'
      additionalProperties: false
      description: The signed line information, that the Broker has confirmed to the Underwriter.
    error_document:
      type: object
      description: The error document.
